<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="outer">

        <div class="left-side">
            <p>Photo by Halie West on Unsplash</p>
            

        </div>

        <div class="right-side">
            <div class="intro">
                <p>
                    This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.
                </p>
                <p>
                    You <em>know</em> you want to!
                </p>
            </div>

            <h2>
                Let's do this
            </h2>

            <form action="">
                <div class="form-row">

                    <div class="form-group">
                        <label for="first-name">First Name</label>
                        <input id="first-name" type="text" required>
                    </div>
                    <div class="form-group">
                        <label for="last-name">Last Name</label>
                        <input id="last-name" type="text" required>
                    </div>

                </div>

                <div class="form-row">
                     <div class="form-group">
                        <label for="email">Email</label>
                        <input id="email" type="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input id="phone" type="tel">
                    </div>
                </div>
                   
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input id="password" type="password" required minlength="8">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input id="confirm-password" type="password" required minlength="8">
                    </div>
                </div>
                    
            </form>
            <hr>
            <div class="form-footer">
                <button class="button">Create Account</button>
                <p>Already have an account?<a href="#">Log in</a> </p>

            </div>

        </div>

    </div>



</body>
</html>
